plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'app.cash.paparazzi'
}

android {
    namespace 'com.appscheduler.lsposed'
    compileSdk 34

    defaultConfig {
        applicationId "com.appscheduler.lsposed"
        minSdk 26
        targetSdk 34
        versionCode 13
        versionName "1.5.7"
        vectorDrawables { useSupportLibrary = true }
    }

    signingConfigs {
        // 固定发布签名：靠 CI 自动生成的 debug.keystore 每次运行都不一样，
        // 会导致「每个版本的签名都不同、用户无法覆盖升级，只能卸载重装丢配置」。
        // 密钥放在仓库 Secret 里，构建时解码到 KEYSTORE_PATH；没有配置时才退回 debug 签名。
        if (System.getenv('KEYSTORE_PATH')) {
            releaseKey {
                storeFile file(System.getenv('KEYSTORE_PATH'))
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig System.getenv('KEYSTORE_PATH') ? signingConfigs.releaseKey : signingConfigs.debug
        }
    }

    buildFeatures {
        compose = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    testOptions {
        // Paparazzi 需要在 JVM 上加载资源与布局库来渲染真实界面
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'com.google.android.material:material:1.12.0'

    implementation platform('androidx.compose:compose-bom:2024.09.03')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    debugImplementation 'androidx.compose.ui:ui-tooling'

    // 仅编译期引用 Xposed API（de.robv.android.xposed v82 接口），运行期由 LSPosed 提供
    compileOnly project(':xposed-api-stub')

    testImplementation 'junit:junit:4.13.2'
    // 单元测试跑在 JVM 上，Android 提供的 org.json 只是空壳，必须换成真实实现
    testImplementation 'org.json:json:20240303'
}

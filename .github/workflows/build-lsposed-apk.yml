name: Build LSPosed APK

on:
  push:
    branches: [ lsposed ]
    tags: [ 'lsposed-v*' ]
  pull_request:
    branches: [ lsposed ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-lsposed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile LSPosed module APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          gradle -p lsposed :app:assembleRelease --no-daemon --stacktrace --warning-mode all

      - name: Prepare artifact
        id: artifact
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 'versionName' lsposed/app/build.gradle | sed -E 's/.*"([^"]+)".*/\1/')
          OUT="app-scheduler-lsposed-v${VERSION}.apk"
          APK=$(find lsposed/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee "${OUT}.sha256"
          ls -lh "$OUT"
          echo "apk_name=${OUT}" >> "$GITHUB_OUTPUT"
          echo "APK_NAME=${OUT}" >> "$GITHUB_ENV"

      - name: Verify APK content
        run: |
          set -euo pipefail
          unzip -l "$APK_NAME" | grep -E 'assets/xposed_init|AndroidManifest.xml|classes.dex'
          echo "xposed_init 内容："
          unzip -p "$APK_NAME" assets/xposed_init

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.apk_name }}
          path: |
            ${{ steps.artifact.outputs.apk_name }}
            ${{ steps.artifact.outputs.apk_name }}.sha256
          if-no-files-found: error

      - name: Publish release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.artifact.outputs.apk_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            ${{ steps.artifact.outputs.apk_name }}
            ${{ steps.artifact.outputs.apk_name }}.sha256
          generate_release_notes: true
